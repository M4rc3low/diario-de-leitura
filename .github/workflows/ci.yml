name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate JavaScript syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate server syntax
        run: node --check server.js

      - name: Validate application syntax
        run: node --check js/app.js

      - name: Validate ISBNdb integration syntax
        run: node --check js/isbndb-enhancer.js
